# Synchrono Service — PENGEMBANGAN LOKAL, berdiri sendiri.
#
# Untuk server, lihat docker-compose.server.yml dan DEPLOY.md.
#
# Tidak butuh checkout langflow-synchrono: lib/, components/, konverter/, dan
# migrasi ada di repo ini. Yang dibutuhkan dari luar hanya dua layanan
# penyimpanan, dijangkau lewat port HOST — milik stack mana pun yang sedang jalan:
#
#     PostgreSQL   host.docker.internal:5432   (DBngin)
#     SeaweedFS    host.docker.internal:8333   (S3; mis. stack Langflow lokal,
#                                               atau docker-compose.infra.yml)
#
#     docker compose up -d --build
#     docker compose --profile mysql up -d --build konverter-mysql   (dump MySQL)
#
# Jaringannya milik service sendiri, jadi nama konverter sama dengan di server
# (`konverter`, `konverter-mysql`, ...) tanpa bentrok DNS dengan stack lain.

services:
  synchrono-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: synchrono-service:2.0.0
    container_name: synchrono-service
    ports:
      - "8000:8000"
    environment:
      # ── Lapisan HTTP ────────────────────────────────────────────────────
      WEB_CONCURRENCY: "1"
      ACCESS_LOG: "0"

      # ── Autentikasi (kontrak Langflow) ──────────────────────────────────
      # Login -> token -> API key, persis Langflow. Kredensialnya sama dengan
      # Langflow lokal, supaya skrip yang memakai satu juga jalan di yang lain.
      SERVICE_SUPERUSER: "admin"
      SERVICE_SUPERUSER_PASSWORD: "synchrono123"
      # Kunci tetap, tanpa lewat login. Perkakas benchmark (beban/, k6)
      # memakai nilai ini. Boleh beberapa, dipisah koma.
      SERVICE_API_KEY: "synchrono-bench-key"

      # ── Koneksi DuckDB ──────────────────────────────────────────────────
      DUCKDB_MODE: "kolam"
      DUCKDB_POOL_SIZE: "8"
      DUCKDB_POOL_TIMEOUT: "30"
      WARMUP_CONNECTIONS: "2"

      # ── Penyimpanan, lewat port host ────────────────────────────────────
      PG_DSN: "host=host.docker.internal port=5432 dbname=synchrono user=postgres"
      S3_ENDPOINT: "host.docker.internal:8333"
      S3_ACCESS_KEY: synchrono
      S3_SECRET_KEY: synchrono123
      S3_USE_SSL: "false"

      WILAYAH_PARQUET: "s3://syncrono-master/wilayah/master_wilayah_nik.parquet"
      WILAYAH_S3_ENDPOINT: ""
      WILAYAH_S3_KEY: ""
      WILAYAH_S3_SECRET: ""
      WILAYAH_KECAMATAN_TEGAS: "0"

      # Batas memori DuckDB — WAJIB di container: tanpanya berkas besar bisa
      # membuat container dibunuh kernel (exit 137).
      DUCKDB_MEMORY_LIMIT: "3GB"
      DUCKDB_TEMP_DIR: "/tmp/duckdb_spill"

      # ── Grading ─────────────────────────────────────────────────────────
      GRADING_MAX_CONCURRENT: "2"
      GRADING_STALE_MINUTES: "15"
      GRADING_CALLBACK_RETRIES: "3"
      GRADING_CALLBACK_TIMEOUT: "20"

      NORMALISASI_AI: "nama_saja"
      NORMALISASI_AI_BASE_URL: ""

      # ── Matching ────────────────────────────────────────────────────────
      # DB portal TIRUAN di PostgreSQL lokal.
      PORTAL_PG_DSN: "host=host.docker.internal port=5432 dbname=portal_sim user=postgres"
      MATCHING_MAX_CONCURRENT: "1"

      # Reasoning matching. Kosong = tanpa LLM (kalimat deterministik).
      REASONING_AI_BASE_URL: "${REASONING_AI_BASE_URL:-}"
      REASONING_AI_MODEL: "${REASONING_AI_MODEL:-gemma3:12b}"
      REASONING_AI_API_KEY: "${REASONING_AI_API_KEY:-}"
      REASONING_AI_ALLOW_EXTERNAL: "${REASONING_AI_ALLOW_EXTERNAL:-0}"
    volumes:
      # Di-mount supaya perubahan tidak perlu rebuild — cukup restart.
      - ./lib:/synchrono/lib:ro
      - ./components:/components:ro
      - ./app:/synchrono/app:ro
      - ./infra:/synchrono/infra:ro
      - ./beban:/synchrono/beban:ro
      # Data uji bersama, di luar repo. Opsional.
      - ../test-data-csv:/synchrono/test-data-csv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [luar, dalam]
    depends_on:
      - konverter
      - s3-relay
    healthcheck:
      # /health tidak menyentuh PostgreSQL — container yang sehat tapi basis
      # datanya sedang mati tidak boleh ikut di-restart berulang-ulang.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Satu-satunya jembatan dari jaringan `dalam` (konverter) ke SeaweedFS.
  s3-relay:
    image: alpine/socat:latest
    container_name: synchrono-service-s3-relay
    command: >
      TCP-LISTEN:8333,fork,reuseaddr
      TCP:host.docker.internal:8333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [dalam, luar]
    restart: unless-stopped

  # ── Konverter jalur B ────────────────────────────────────────────────────
  #
  # Hanya di jaringan `dalam`, tanpa `ports:`. PostgreSQL selalu naik; yang lain
  # di balik profil:  docker compose --profile mysql up -d --build konverter-mysql
  konverter:
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter
    container_name: synchrono-service-konverter
    environment:
      POSTGRES_PASSWORD: konversi_lokal
      POSTGRES_DB: postgres
      KONV_PG_HOST: 127.0.0.1
      KONV_PG_PORT: "5432"
      KONV_PORT: "8390"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_DETIK: "1800"
      KONV_BATAS_MB: "4096"
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: synchrono
      S3_SECRET_KEY: synchrono123
      S3_USE_SSL: "false"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-pg18:/var/lib/postgresql
    networks: [dalam]
    restart: unless-stopped

  konverter-mysql:
    profiles: [mysql]
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter-mysql
    container_name: synchrono-service-konverter-mysql
    environment:
      MARIADB_ROOT_PASSWORD: Konversi_Lokal_12345
      KONV_MESIN: mysql
      KONV_PORT: "8393"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_DETIK: "1800"
      KONV_BATAS_MB: "4096"
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: synchrono
      S3_SECRET_KEY: synchrono123
      S3_USE_SSL: "false"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-mysql-data:/var/lib/mysql
    networks: [dalam]
    restart: unless-stopped

  konverter-mssql:
    profiles: [mssql]
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter-mssql
    container_name: synchrono-service-konverter-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Konversi_Lokal_12345!
      KONV_MESIN: sqlserver
      KONV_PORT: "8391"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_MB: "4096"
      KONV_DUCKDB_HOME: /var/opt/mssql
      KONV_KERJA_UNDUH: /var/opt/mssql/data/unduh
      KONV_MSSQL_KERJA: /var/opt/mssql/data/uji
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: synchrono
      S3_SECRET_KEY: synchrono123
      S3_USE_SSL: "false"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-mssql-data:/var/opt/mssql/data
    networks: [dalam]
    restart: unless-stopped

  konverter-oracle:
    profiles: [oracle]
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter-oracle
    container_name: synchrono-service-konverter-oracle
    environment:
      ORACLE_PASSWORD: Konversi_Lokal_12345
      KONV_MESIN: oracle
      KONV_PORT: "8392"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_MB: "4096"
      KONV_ORA_DSN: "localhost:1521/FREEPDB1"
      KONV_ORA_KERJA: /opt/oracle/dmp
      KONV_ORA_DIRNAME: KONVERSI_DIR
      KONV_KERJA_UNDUH: /opt/oracle/dmp/unduh
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: synchrono
      S3_SECRET_KEY: synchrono123
      S3_USE_SSL: "false"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-oracle-data:/opt/oracle/oradata
    networks: [dalam]
    restart: unless-stopped

networks:
  luar:
    driver: bridge
  dalam:
    internal: true

volumes:
  konverter-pg18:
  konverter-mysql-data:
  konverter-mssql-data:
  konverter-oracle-data:
