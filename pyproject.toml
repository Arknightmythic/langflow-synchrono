[project]
name = "synchrono-engine"
version = "2.0.0"
description = "Synchrono Data Reconciliation, Matching, Grading & AI Reasoning Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
