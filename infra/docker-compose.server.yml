# Langflow Synchrono — DEPLOY KE SERVER (172.16.12.98).
#
# Beda pokok dengan docker-compose.yml (pengembangan lokal):
#
#   1. TIDAK menjalankan SeaweedFS sendiri. Memakai SeaweedFS yang sudah ada
#      di server (172.16.12.98:8333). Jadi tidak ada service seaweedfs di sini.
#   2. PostgreSQL dan SeaweedFS diarahkan ke server, bukan ke host lokal.
#   3. Rujukan wilayah dibaca dari SeaweedFS server yang sama dengan berkas
#      unggahan — jadi WILAYAH_S3_ENDPOINT dikosongkan (memakai secret utama),
#      bukan lagi kredensial terpisah.
#
# SATU BERKAS UNTUK DUA BENTUK SERVER
#
# SeaweedFS dan PostgreSQL di sini adalah penyimpanan BACKEND pipeline, bukan
# milik konverter, dan letaknya berbeda di tiap server:
#
#     server lama   dipasang langsung di host, di luar Docker
#     server baru   container, di compose yang BERBEDA (docker-compose.infra.yml)
#
# Dua-duanya dijangkau lewat IP HOST, jadi bentuknya sama dari sisi berkas ini.
# Yang membedakan cuma alamatnya, dan itu ada di .env:
#
#     S3_ENDPOINT=172.16.12.98:8333     (server lama)
#     S3_ENDPOINT=192.168.2.107:8355    (server baru)
#
# Karena itu tidak ada percabangan di sini sama sekali.
#
# Nilai rahasia (kata sandi PostgreSQL) TIDAK ditaruh di sini. Diisi lewat
# berkas .env di sebelah compose ini — salin dari .env.server.example.
#
# Menjalankan — SATU perintah, skema ikut diterapkan:
#     cp .env.server.example .env
#     # isi PG_PASSWORD di .env
#     docker compose -f docker-compose.server.yml --env-file .env up -d --build
#
# Langkah lengkap: lihat DEPLOY.md.

# DSN ditulis SEKALI di sini lalu dipakai dua service. Kalau ditulis dua kali,
# cepat atau lambat yang satu diubah dan yang lain tertinggal — dan gejalanya
# membingungkan: skema masuk ke satu basis data, Langflow membaca yang lain.
x-pg-dsn: &pg_dsn "host=${PG_HOST:-172.16.12.98} port=${PG_PORT:-5430} dbname=${PG_DB:-synchrono} user=${PG_USER:-root} password=${PG_PASSWORD:?isi di .env}"

services:
  # ── Migrasi + seeder, sekali jalan lalu berhenti ──────────────────────
  #
  # Dijalankan SEBELUM Langflow, dan Langflow menunggunya selesai dengan sukses.
  # Tanpa ini, `up -d` menyalakan Langflow di atas basis data kosong dan SEMUA
  # endpoint balas 500 — dengan penyebab yang hanya terlihat di log.
  #
  # DUA LANGKAH TERPISAH, DAN ITU DISENGAJA:
  #
  #   migrate.py  mengubah BENTUK basis data. Tiap berkas migrasi dicatat di
  #               `schema_migrations` dan tidak pernah dijalankan dua kali.
  #   seed.py     mengisi DATA awal dengan ON CONFLICT DO NOTHING. Ia mengisi
  #               yang belum ada dan TIDAK PERNAH menimpa yang sudah ada.
  #
  # Karena itu ambang yang sudah disetel operator lewat API config tidak akan
  # dikembalikan ke nilai bawaan tiap kali `docker compose up` dijalankan.
  # (Diuji: nilai yang diubah tetap bertahan setelah migrate + seed diulang.)
  #
  # Menunggu PostgreSQL siap, bukan langsung menyerah. Saat server baru menyala,
  # PostgreSQL sering belum menerima koneksi pada detik-detik pertama.
  skema:
    build:
      context: .
      dockerfile: Dockerfile.langflow
    container_name: synchrono-skema
    environment:
      PG_DSN: *pg_dsn
      # Berapa kali menunggu PostgreSQL sebelum menyerah (jeda 5 detik).
      # 12 = satu menit; cukup untuk PostgreSQL yang baru ikut menyala.
      SKEMA_PERCOBAAN: "${SKEMA_PERCOBAAN:-12}"
    # Hanya `luar`: yang dibutuhkannya cuma PostgreSQL di host.
    networks: [luar]
    volumes:
      - .:/synchrono/infra:ro
    command:
      - sh
      - -c
      - |
        cd /synchrono/infra
        for i in $$(seq 1 "$${SKEMA_PERCOBAAN:-12}"); do
          if python migrate.py && python seed.py; then
            echo "[skema] migrasi & seeding selesai."
            exit 0
          fi
          echo "[skema] PostgreSQL belum siap / gagal — percobaan $$i, ulang 5 detik lagi"
          sleep 5
        done
        echo "[skema] GAGAL setelah $${SKEMA_PERCOBAAN:-12} percobaan. Periksa PG_HOST/PG_PORT/PG_PASSWORD di .env."
        exit 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  langflow:
    build:
      context: .
      dockerfile: Dockerfile.langflow
    container_name: synchrono-langflow
    ports:
      - "7860:7860"
    environment:
      LANGFLOW_COMPONENTS_PATH: /components

      # Kredensial admin Langflow. GANTI dari nilai pengembangan sebelum benar-
      # benar dipakai — ini yang menjaga siapa boleh membuat API key.
      LANGFLOW_SUPERUSER: "${LANGFLOW_SUPERUSER:-admin}"
      LANGFLOW_SUPERUSER_PASSWORD: "${LANGFLOW_SUPERUSER_PASSWORD:?isi di .env}"
      LANGFLOW_AUTO_LOGIN: "false"

      LANGFLOW_CONFIG_DIR: /app/langflow-data
      # WAJIB — tanpa ini flow & API key lenyap tiap container di-recreate.
      # Empat garis miring memang benar (tiga untuk skema, satu path absolut).
      LANGFLOW_DATABASE_URL: "sqlite:////app/langflow-data/langflow.db"

      # Modul bersama di PYTHONPATH, di LUAR /components (Langflow memuat
      # /components sebagai bundle terisolasi yang tidak masuk sys.path).
      PYTHONPATH: /synchrono/lib

      # ── PostgreSQL server ──────────────────────────────────────────────
      # Server menjalankan PostgreSQL dengan otentikasi kata sandi. Kata
      # sandinya diisi lewat .env, tidak ditulis di berkas ini.
      # PERHATIKAN portnya 5430, bukan 5432 yang lazim.
      PG_DSN: *pg_dsn

      # ── SeaweedFS server ───────────────────────────────────────────────
      # Berkas unggahan portal ada di bucket syncrono-uploads di server ini.
      S3_ENDPOINT: "${S3_ENDPOINT:-172.16.12.98:8333}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"

      # ── Rujukan wilayah ────────────────────────────────────────────────
      # Ada di SeaweedFS server yang SAMA dengan berkas unggahan, jadi endpoint
      # dikosongkan: _wilayah.muat() memakai secret utama S3 di atas. 7.265
      # kecamatan, sudah ada di s3://syncrono-master/wilayah/.
      WILAYAH_PARQUET: "s3://syncrono-master/wilayah/master_wilayah_nik.parquet"
      WILAYAH_S3_ENDPOINT: ""
      WILAYAH_S3_KEY: ""
      WILAYAH_S3_SECRET: ""
      # 0 = kode kecamatan tak dikenal hanya DILAPORKAN. Nyalakan (1) begitu
      # data Dukcapil sungguhan masuk; pada data dummy ini menjatuhkan grade.
      WILAYAH_KECAMATAN_TEGAS: "${WILAYAH_KECAMATAN_TEGAS:-0}"

      # ── Batas memori DuckDB ─────────────────────────────────────────────
      #
      # WAJIB di container, dan bukan penyetelan halus. Bawaan DuckDB adalah
      # 80% RAM YANG IA LIHAT — dan di dalam container ia melihat RAM MESIN,
      # bukan batas cgroup-nya. Jadi ia mengalokasi melewati batas container
      # lalu kernel membunuhnya: exit code 137, tanpa pesan galat apa pun.
      #
      # Diukur pada container berbatas 5,79 GB dengan berkas 35 kolom:
      #     tanpa batas : 3 juta baris OK (3,96 GB) --  5 juta MATI OOM
      #     batas 3 GB  : 5 juta OK (3,45 GB)       -- 10 juta OK (3,54 GB)
      #
      # Memorinya justru LEBIH RENDAH dengan batas disetel, dan mendatar dari
      # 5 ke 10 juta baris. Batas ini tidak mengorbankan apa pun; ia membuat
      # DuckDB mengelola buffer-nya, bukan menimbun.
      #
      # SETEL SEKITAR 60% BATAS MEMORI CONTAINER SERVER. Kalau server punya
      # 16 GB untuk container ini, 10GB masuk akal.
      DUCKDB_MEMORY_LIMIT: "${DUCKDB_MEMORY_LIMIT:-3GB}"
      # Tempat tumpahan kalau batas di atas tetap terlampaui. Butuh ruang lega —
      # tumpahan bisa berkali-kali lipat ukuran berkas masukan.
      DUCKDB_TEMP_DIR: "${DUCKDB_TEMP_DIR:-/tmp/duckdb_spill}"

      # ── Kolam koneksi DuckDB ────────────────────────────────────────────
      #
      # Empat node API meminjam koneksi yang sudah terbuka alih-alih membuka
      # yang baru setiap panggilan. Membuka satu koneksi terukur 327,6 ms, dan
      # itu dua pertiga waktu panggilan endpoint ringan.
      #
      # `per_request` mengembalikan perilaku sebelum kolam dipasang, tanpa
      # menyentuh kode — jalur mundur kalau kolamnya suatu saat bermasalah.
      DUCKDB_MODE: "${DUCKDB_MODE:-kolam}"
      # PENTING saat memilih angkanya: tiap koneksi adalah basis data
      # in-memory tersendiri, sehingga DUCKDB_MEMORY_LIMIT di atas berlaku PER
      # KONEKSI, bukan untuk seluruh proses. Jadi angka ini ikut menentukan
      # batas atas pemakaian memori, bukan sekadar tingkat konkurensi.
      #
      # Dalam praktiknya keempat endpoint ringan hanya membaca beberapa baris,
      # jadi mereka tidak pernah mendekati batas itu. Kapasitas terukur pun
      # jenuh di 4 penelepon bersamaan, sehingga menurunkannya ke 4 tidak
      # mengorbankan throughput apa pun di server yang memorinya sempit.
      DUCKDB_POOL_SIZE: "${DUCKDB_POOL_SIZE:-8}"
      # Batas tunggu saat semua koneksi sedang dipakai. Lewat dari ini, lebih
      # baik gagal jujur daripada menggantung sampai klien menyerah sendiri.
      DUCKDB_POOL_TIMEOUT: "${DUCKDB_POOL_TIMEOUT:-30}"
      # Koneksi yang lebih tua dari ini dibuang saat dikembalikan. Langflow di
      # server hidup berhari-hari, dan ATTACH ke PostgreSQL yang sudah lama
      # menganggur bisa mati diam-diam — bukan saat diperiksa, melainkan saat
      # dipakai, di tengah permintaan pengguna. 0 = tidak pernah didaur ulang.
      DUCKDB_POOL_MAX_UMUR: "${DUCKDB_POOL_MAX_UMUR:-1800}"

      # ── Grading ────────────────────────────────────────────────────────
      GRADING_MAX_CONCURRENT: "${GRADING_MAX_CONCURRENT:-2}"
      GRADING_STALE_MINUTES: "15"
      GRADING_CALLBACK_RETRIES: "3"
      GRADING_CALLBACK_TIMEOUT: "20"

      # ── Normalisasi: bantuan AI ────────────────────────────────────────
      # off secara bawaan. Server punya Ollama on-prem di :11434 — untuk
      # menyalakannya, isi NORMALISASI_AI_BASE_URL di .env dengan
      # http://172.16.12.98:11434/v1 dan setel NORMALISASI_AI=nama_saja.
      NORMALISASI_AI: "${NORMALISASI_AI:-nama_saja}"
      NORMALISASI_AI_MODEL: "${NORMALISASI_AI_MODEL:-gemma4:31b}"
      NORMALISASI_AI_BASE_URL: "${NORMALISASI_AI_BASE_URL:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-ollama}"
    volumes:
      # Hanya yang berjalan saat runtime. Skrip pengembangan (pembuat data uji,
      # cadangan, dsb.) tidak di-mount — lihat DEPLOY.md untuk daftar berkas
      # yang benar-benar perlu dinaikkan.
      - ../components:/components:ro
      - ../lib:/synchrono/lib:ro
      - .:/synchrono/infra:ro
      - langflow-data:/app/langflow-data
    command: ["langflow", "run", "--host", "0.0.0.0", "--port", "7860"]
    # Menunggu skema selesai diterapkan. Kalau `skema` gagal (mis. kata sandi
    # salah), Langflow SENGAJA tidak ikut menyala — lebih baik gagal terang-
    # terangan daripada menyala dengan seluruh endpoint balas 500.
    depends_on:
      skema:
        condition: service_completed_successfully
    # host.docker.internal tetap dipetakan supaya sama dengan compose lokal;
    # di server, PG & S3 dijangkau lewat IP 172.16.12.98 langsung.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # DUA jaringan, dan keduanya dibutuhkan:
    #   luar   — PostgreSQL dan SeaweedFS backend, yang dijangkau lewat IP host
    #   dalam  — memanggil layanan konversi, yang tidak boleh punya jalan keluar
    networks: [luar, dalam]
    restart: unless-stopped

  # ── JALUR B: konversi berkas yang isinya PERINTAH ────────────────────────
  #
  # `.sql`, `.dmp`, dan `.mdf` tidak dibaca melainkan DIPULIHKAN ke mesin basis
  # datanya. Itu tidak boleh terjadi di dalam container grading, yang memegang
  # kredensial S3 dan koneksi PostgreSQL produksi. Lihat UNGGAHAN.md.
  #
  # Ketiganya container terpisah, satu per mesin: tiap mesin datang dengan
  # image, cara inisialisasi, dan lisensinya sendiri.
  #
  # PENTING — ketiganya HANYA di jaringan `dalam`, yang `internal: true` dan
  # karena itu tidak punya rute ke mana pun selain container sejaring. Sudah
  # diukur dari dalam container:
  #
  #     container sejaring     TERJANGKAU
  #     gateway jaringannya    GAGAL (TimeoutError)
  #     host.docker.internal   GAGAL (gaierror)
  #     internet               GAGAL
  #
  # Satu-satunya jalan keluarnya adalah penerus S3 di bawah.

  # Penerus S3 — SATU port, ke SATU alamat.
  #
  # Inilah yang membuat berkas ini bekerja di kedua bentuk server tanpa
  # percabangan: SeaweedFS-nya boleh di host (server lama) atau di compose lain
  # (server baru), yang berubah cuma alamat tujuan di .env.
  #
  # TCP mentah, bukan proxy HTTP. Tanda tangan SigV4 dihitung atas header
  # `Host` yang dikirim klien dan diverifikasi ulang oleh SeaweedFS dari header
  # yang diterimanya; proxy yang menulis ulang Host akan membatalkannya. socat
  # tidak menyentuh apa pun — sudah diuji, unduh maupun unggah parquet lolos.
  s3-relay:
    image: alpine/socat:latest
    container_name: synchrono-s3-relay
    command: >
      TCP-LISTEN:8333,fork,reuseaddr
      TCP:${S3_RELAY_TARGET:-172.16.12.98:8333}
    networks: [dalam, luar]
    restart: unless-stopped

  konverter:
    build:
      context: ..
      dockerfile: infra/Dockerfile.konverter
    container_name: synchrono-konverter
    environment:
      # Superuser hanya untuk CREATE/DROP DATABASE. Dumpnya dipulihkan sebagai
      # peran `pemulih` yang BUKAN superuser — lihat konverter/_pulih.py.
      POSTGRES_PASSWORD: "${KONV_PG_PASSWORD:-konversi_lokal}"
      POSTGRES_DB: postgres
      KONV_PG_HOST: 127.0.0.1
      KONV_PG_PORT: "5432"
      KONV_PORT: "8390"
      KONV_MAX_CONCURRENT: "${KONV_MAX_CONCURRENT:-1}"
      KONV_BATAS_DETIK: "${KONV_BATAS_DETIK:-1800}"
      KONV_BATAS_MB: "${KONV_BATAS_MB:-4096}"
      LIB_SYNCHRONO: /synchrono/lib
      # Lewat penerus, dan nama ini sama di semua tempat.
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"
    volumes:
      - ../lib:/synchrono/lib:ro
      - ../konverter:/konverter:ro
      - konverter-data:/var/lib/postgresql/data
    networks: [dalam]
    restart: unless-stopped

  konverter-mssql:
    profiles: [mssql]
    build:
      context: ..
      dockerfile: infra/Dockerfile.konverter-mssql
    container_name: synchrono-konverter-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${KONV_MSSQL_PASSWORD:-Konversi_Lokal_12345!}"
      KONV_MESIN: sqlserver
      KONV_PORT: "8391"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_MB: "${KONV_BATAS_MB:-4096}"
      KONV_DUCKDB_HOME: /var/opt/mssql
      KONV_KERJA_UNDUH: /var/opt/mssql/data/unduh
      KONV_MSSQL_KERJA: /var/opt/mssql/data/uji
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"
    volumes:
      - ../lib:/synchrono/lib:ro
      - ../konverter:/konverter:ro
      - konverter-mssql-data:/var/opt/mssql/data
    networks: [dalam]
    restart: unless-stopped

  konverter-oracle:
    profiles: [oracle]
    build:
      context: ..
      dockerfile: infra/Dockerfile.konverter-oracle
    container_name: synchrono-konverter-oracle
    environment:
      ORACLE_PASSWORD: "${KONV_ORACLE_PASSWORD:-Konversi_Lokal_12345}"
      KONV_MESIN: oracle
      KONV_PORT: "8392"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_MB: "${KONV_BATAS_MB:-4096}"
      KONV_ORA_DSN: "localhost:1521/FREEPDB1"
      KONV_ORA_KERJA: /opt/oracle/dmp
      KONV_ORA_DIRNAME: KONVERSI_DIR
      KONV_KERJA_UNDUH: /opt/oracle/dmp/unduh
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"
    volumes:
      - ../lib:/synchrono/lib:ro
      - ../konverter:/konverter:ro
      - konverter-oracle-data:/opt/oracle/oradata
    networks: [dalam]
    restart: unless-stopped

networks:
  # `luar` — bridge biasa. Yang di sini bisa menjangkau host, jadi inilah yang
  # dipakai untuk PostgreSQL dan SeaweedFS backend.
  luar:
    driver: bridge
  # `dalam` — TANPA rute ke mana pun. Konverter tinggal di sini sendirian
  # (bersama penerus S3 dan langflow yang memanggilnya), sehingga berkas tidak
  # tepercaya yang dipulihkannya tidak punya jalan keluar sama sekali.
  dalam:
    internal: true

volumes:
  langflow-data:
  konverter-data:
  konverter-mssql-data:
  konverter-oracle-data:
