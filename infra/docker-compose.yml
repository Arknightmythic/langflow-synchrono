# SeaweedFS untuk service matching Synchrono.
#
# Mode `server` menjalankan master + volume + filer + S3 gateway sekaligus dalam
# satu container. Cukup untuk development dan untuk service ini; kalau nanti naik
# ke produksi, komponen-komponennya bisa dipisah.
#
# Port:
#   8333 -> S3 API   <- ini yang dipakai DuckDB httpfs
#   9333 -> master UI
#   8888 -> filer
#
# Kredensial S3 didefinisikan di s3-config.json (accessKey: synchrono).

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: synchrono-seaweedfs
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3-config.json
      -master.volumeSizeLimitMB=2048
      -volume.max=100
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweed-data:/data
      - ./s3-config.json:/etc/seaweedfs/s3-config.json:ro
    restart: "no"
    healthcheck:
      # Dua hal yang sempat salah di sini, keduanya sudah diuji:
      #
      #  1. `localhost` TIDAK bisa dipakai — SeaweedFS bind ke IP container
      #     (mis. 172.20.0.2), bukan ke loopback. Pakai nama service-nya.
      #  2. Endpoint S3 (:8333) membalas 403 untuk request anonim, dan wget
      #     menganggap itu kegagalan. Pakai status master (:9333) yang balas 200.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://seaweedfs:9333/cluster/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Langflow: inilah "backend"-nya service matching ────────────────────
  #
  # Backend Synchrono memanggil flow di sini lewat API. Node-node matching
  # dimuat dari folder components/ yang di-mount.
  #
  # Dijalankan di container, bukan di venv host, karena di mesin Windows ini
  # DLL `_xxhash` diblokir Application Control policy sehingga `import langflow`
  # gagal. Di container kebijakan itu tidak berlaku.
  langflow:
    build:
      context: .
      dockerfile: Dockerfile.langflow
    container_name: synchrono-langflow
    ports:
      - "7860:7860"
    environment:
      # Dari sini Langflow menemukan ketujuh node matching.
      LANGFLOW_COMPONENTS_PATH: /components

      # WAJIB di Langflow 1.12.x — tanpa ini container gagal start dengan
      # "ValueError: Username and password must be set", dan password default
      # lama juga ditolak. Ini kredensial DEVELOPMENT; ganti sebelum dipakai
      # di luar mesin lokal.
      LANGFLOW_SUPERUSER: admin
      LANGFLOW_SUPERUSER_PASSWORD: synchrono123
      LANGFLOW_AUTO_LOGIN: "false"

      LANGFLOW_CONFIG_DIR: /app/langflow-data

      # ── Batas konkurensi Langflow ────────────────────────────────────────
      #
      # Langflow PUNYA rate limiter (`rate_limit_enabled: true`,
      # `rate_limit_per_minute: 5`), tapi ditelusuri di kodenya ia hanya
      # dipasang di tiga tempat: api/v1/login.py, api/v2/workflow_public.py,
      # dan build flow PUBLIC di api/v1/chat.py. Jalur yang dipakai portal,
      # POST /api/v1/run/<flow> (api/v1/endpoints.py), TIDAK disentuh.
      # Buktinya ada di angkanya sendiri: 5/menit itu 0,083 rps, sementara
      # terukur 4,6 rps. Jadi plafon itu bukan ulah limiter.
      #
      # Yang membatasi: uvicorn bawaan jalan dengan SATU worker. Semua
      # permintaan API antre di satu proses Python, dan GIL-nya menahan
      # throughput meski empat inti tersedia.
      #
      # Menaikkannya AMAN untuk deployment ini karena status job disimpan di
      # tabel `grading_jobs` PostgreSQL, bukan di memori proses — polling boleh
      # mendarat di worker mana pun. Yang TIDAK aman adalah antrean build milik
      # Langflow sendiri, yang memang hidup di memori satu worker; karena itu
      # Langflow menolak start tanpa flag di bawah.
      #
      # TERUKUR (berkas 10 juta baris, polling 2 rps, mesin 4 inti / 5,79 GB):
      #
      #                        1 worker     4 worker
      #   plafon status rps       4,62         4,84
      #   p95 polling saat
      #     grading 5 juta     6.155 ms     1.528 ms     4,0x lebih baik
      #     grading 10 juta    2.177 ms     1.224 ms     1,8x lebih baik
      #   grading 10 juta        318,8 s      280,5 s
      #   memori idle           1,22 GB      3,08 GB
      #
      # Plafon rps-nya nyaris tidak bergerak — yang membatasinya ongkos CPU per
      # permintaan, bukan jumlah worker. Yang benar-benar membaik responsivitas
      # polling SELAMA grading panjang berjalan, dan itu yang dirasakan portal.
      # 8 worker tidak menambah apa-apa lagi (4,92 rps) tapi memakan 4,40 GB.
      #
      # DEFAULTNYA 1, DAN ITU DISENGAJA. Dengan lebih dari satu worker, kanvas
      # dan playground Langflow BERHENTI BEKERJA — antrean build-nya hidup di
      # memori satu worker, sementara GET /api/v1/build/<job_id>/events
      # dibagi rata ke worker lain. Langflow sendiri menolak start tanpa flag
      # di bawah, dan mencetak peringatan panjang saat dilewati.
      #
      # Naikkan HANYA kalau deployment ini dipakai lewat API saja:
      #
      #     LANGFLOW_WORKERS=4 docker compose up -d langflow
      #
      # Dan periksa memorinya dulu: 4 worker menahan 3,08 GB, sementara
      # DUCKDB_MEMORY_LIMIT disetel 3 GB. Keduanya muat di mesin 5,79 GB —
      # 10 juta baris terbukti selesai, tidak OOM — tapi marginnya tipis.
      LANGFLOW_WORKERS: "${LANGFLOW_WORKERS:-1}"
      LANGFLOW_DANGEROUSLY_ALLOW_MULTI_WORKER_WITHOUT_SHARED_QUEUE: "true"

      # Tracing diaktifkan agar Flow Activity merekam riwayat run di UI Langflow
      LANGFLOW_DEACTIVATE_TRACING: "false"

      # WAJIB, dan TIDAK cukup hanya mengandalkan LANGFLOW_CONFIG_DIR.
      #
      # Langflow 1.12.x menaruh SQLite-nya di dalam folder paketnya sendiri
      # (/app/.venv/lib/python3.14/site-packages/langflow/langflow.db), bukan di
      # config dir. Folder itu ada di lapisan container, jadi SELURUH flow dan
      # API key lenyap setiap kali container di-recreate atau image di-rebuild —
      # dan hilangnya diam-diam, tanpa pesan galat apa pun.
      #
      # Empat garis miring memang benar: tiga untuk skema sqlite://, satu lagi
      # pembuka path absolut.
      LANGFLOW_DATABASE_URL: "sqlite:////app/langflow-data/langflow.db"

      # Modul bersama DIPISAH dari /components, dan ini WAJIB.
      #
      # Langflow memuat tiap berkas di LANGFLOW_COMPONENTS_PATH sebagai "bundle
      # module" yang terisolasi, dan folder itu TIDAK ikut masuk sys.path.
      # Akibatnya berkas di sana tidak bisa saling mengimpor — component yang
      # menulis `from _shared import ...` gagal dengan
      # "ModuleNotFoundError: No module named '_shared'" meski berkasnya ada di
      # folder yang sama persis. (Diuji langsung, bukan dugaan.)
      #
      # Satu-satunya jalan agar modul bersama bisa diimpor adalah lewat
      # PYTHONPATH, jadi ia harus berada di LUAR /components.
      #
      # Tujuannya /synchrono/lib, BUKAN /lib. Mem-bind-mount ke /lib menimpa
      # direktori pustaka sistem container; sempat berjalan hanya karena image
      # ini menaruh pustakanya di /usr/lib64.
      PYTHONPATH: /synchrono/lib

      # ── Rujukan wilayah NIK ────────────────────────────────────────────
      #
      # Daftar kode wilayah TIDAK lagi ditanam di kode. Berkas ini bisa
      # disunting aplikasi Synchrono, jadi dialah sumber yang sesungguhnya.
      #
      # Kredensialnya terpisah karena berkas rujukan ada di SeaweedFS SERVER,
      # sedangkan berkas unggahan (saat pengembangan) ada di SeaweedFS lokal.
      # Secret-nya ber-SCOPE, jadi keduanya bisa dipakai bersamaan.
      #
      # Kalau tidak terjangkau, pemeriksaan wilayah DIMATIKAN dan grading tetap
      # jalan — tabel rujukan yang kosong akan membuat setiap NIK jatuh tidak
      # sah, dan itu jauh lebih merusak daripada melewatkan satu pemeriksaan.
      WILAYAH_PARQUET: "s3://syncrono-master/wilayah/master_wilayah_nik.parquet"
      WILAYAH_S3_ENDPOINT: "http://172.16.12.98:8333"
      WILAYAH_S3_KEY: "ADMIN"
      WILAYAH_S3_SECRET: "Password1234"


      # ── Batas memori DuckDB ─────────────────────────────────────────────
      #
      # WAJIB di container, dan bukan penyetelan halus. Bawaan DuckDB adalah
      # 80% RAM YANG IA LIHAT — dan di dalam container ia melihat RAM MESIN,
      # bukan batas cgroup-nya. Jadi ia mengalokasi melewati batas container
      # lalu kernel membunuhnya: exit code 137, tanpa pesan galat apa pun.
      #
      # Diukur pada container berbatas 5,79 GB dengan berkas 35 kolom:
      #     tanpa batas : 3 juta baris OK (3,96 GB) --  5 juta MATI OOM
      #     batas 3 GB  : 5 juta OK (3,45 GB)       -- 10 juta OK (3,54 GB)
      #
      # Perhatikan memorinya justru LEBIH RENDAH dengan batas disetel, dan
      # mendatar dari 5 ke 10 juta baris. Batas ini bukan mengorbankan apa pun;
      # ia membuat DuckDB mengelola buffer-nya, bukan menimbun.
      #
      # Setel sekitar 60% batas memori container.
      DUCKDB_MEMORY_LIMIT: "3GB"
      # Tempat tumpahan kalau batas di atas tetap terlampaui. Butuh ruang lega.
      DUCKDB_TEMP_DIR: "/tmp/duckdb_spill"

      # ── Kolam koneksi DuckDB ────────────────────────────────────────────
      # `per_request` mengembalikan perilaku sebelum kolam dipasang, tanpa
      # menyentuh kode. Berguna untuk mengukur ongkos kolamnya berdampingan.
      DUCKDB_MODE: "${DUCKDB_MODE:-kolam}"
      # DUCKDB_MEMORY_LIMIT di atas berlaku PER KONEKSI — tiap koneksi adalah
      # basis data in-memory tersendiri.
      DUCKDB_POOL_SIZE: "${DUCKDB_POOL_SIZE:-8}"
      DUCKDB_POOL_TIMEOUT: "${DUCKDB_POOL_TIMEOUT:-30}"
      DUCKDB_POOL_MAX_UMUR: "${DUCKDB_POOL_MAX_UMUR:-1800}"

      # ── Grading ────────────────────────────────────────────────────────
      # Berapa job grading boleh jalan bersamaan dalam satu container. Tiap job
      # memegang koneksi DuckDB sendiri; terlalu banyak = rebutan memori.
      GRADING_MAX_CONCURRENT: "2"
      # Job yang tidak berdetak selama ini dinyatakan gagal. Inilah yang
      # menyelamatkan job saat container restart di tengah proses.
      GRADING_STALE_MINUTES: "15"
      GRADING_CALLBACK_RETRIES: "3"
      GRADING_CALLBACK_TIMEOUT: "20"

      # ── Normalisasi kolom: bantuan AI ──────────────────────────────────
      #
      # AI adalah lapis KELIMA, dipanggil hanya kalau keempat lapis
      # deterministik (alias, nama mirip, bentuk nilai, kamus master) gagal.
      # Satu panggilan per berkas, ~1,3 detik.
      #
      #   off           tidak memanggil AI sama sekali
      #   nama_saja     AI hanya menerima NAMA KOLOM  <- bawaan
      #   dengan_sampel AI juga menerima contoh nilai
      #
      # Bawaannya `nama_saja` bukan kehati-hatian berlebihan: diuji dengan
      # 12 nama kolom samaran, model memetakan 12/12 benar TANPA melihat satu
      # nilai pun. Contoh nilai jarang benar-benar dibutuhkan.
      NORMALISASI_AI: "nama_saja"
      NORMALISASI_AI_MODEL: "gemma4:31b"
      NORMALISASI_AI_TIMEOUT: "60"
      NORMALISASI_AI_SAMPEL: "5"

      # KOSONG = AI mati. Isi dengan Ollama on-prem untuk menyalakannya.
      #
      # PERHATIKAN BEDANYA. https://ollama.com adalah layanan hosted pihak
      # ketiga, BUKAN on-prem — meski sama-sama bernama Ollama. Mengarahkan ke
      # sana berarti nama kolom (dan, kalau `dengan_sampel`, juga NIK dan nama
      # ibu kandung) keluar dari jaringan.
      #
      # Karena itu `dengan_sampel` DITOLAK pada endpoint non-lokal kecuali
      # NORMALISASI_AI_IZIN_SAMPEL_LUAR=1 disetel secara sadar.
      NORMALISASI_AI_BASE_URL: ""
      # OLLAMA_API_KEY: ""

      # ── Reasoning AI ───────────────────────────────────────────────────
      REASONING_AI_BASE_URL: "${REASONING_AI_BASE_URL:-}"
      REASONING_AI_MODEL: "${REASONING_AI_MODEL:-gemma3:12b}"
      REASONING_AI_API_KEY: "${REASONING_AI_API_KEY:-}"
      REASONING_AI_TIMEOUT: "${REASONING_AI_TIMEOUT:-120}"
      REASONING_MAX_CONCURRENT: "${REASONING_MAX_CONCURRENT:-1}"
      MASTER_PARQUET_PATH: "${MASTER_PARQUET_PATH:-}"

      # PostgreSQL berjalan di HOST (DBngin), bukan di Docker — karena itu
      # host.docker.internal, bukan localhost.
      PG_DSN: "host=host.docker.internal port=5432 dbname=synchrono user=postgres"

      # SeaweedFS satu jaringan compose, jadi cukup nama service-nya.
      S3_ENDPOINT: "seaweedfs:8333"
      S3_ACCESS_KEY: synchrono
      S3_SECRET_KEY: synchrono123
      S3_USE_SSL: "false"
    volumes:
      - ../components:/components:ro
      - ../lib:/synchrono/lib:ro
      # Skrip infra ikut dimasukkan supaya bisa dijalankan dengan `docker exec`.
      # Di mesin ini extension httpfs DuckDB diblokir Application Control, jadi
      # apa pun yang menyentuh SeaweedFS harus jalan di dalam container.
      - .:/synchrono/infra:ro
      - ../run_grading_local.py:/synchrono/run_grading_local.py:ro
      - ../run_local.py:/synchrono/run_local.py:ro
      - ../run_reasoning_local.py:/synchrono/run_reasoning_local.py:ro
      - langflow-data:/app/langflow-data
    # WAJIB dioverride: entrypoint bawaan image mengikat ke 127.0.0.1, sehingga
    # port mapping Docker tidak bisa menjangkaunya (dari dalam container
    # /health_check balas 200, dari host tidak ada respons sama sekali).
    # Env LANGFLOW_HOST tidak dihormati — harus lewat argumen CLI.
    command: ["langflow", "run", "--host", "0.0.0.0", "--port", "7860"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - seaweedfs
    restart: "no"

volumes:
  seaweed-data:
  langflow-data:
