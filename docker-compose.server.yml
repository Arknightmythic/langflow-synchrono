# Synchrono Service — DEPLOY KE SERVER, BERDIRI SENDIRI.
#
# Tidak butuh checkout langflow-synchrono sama sekali (keputusan 28 Sep 2026):
# lib/, components/, konverter jalur B, dan migrasi/seed semuanya ada di repo
# ini. Yang dibutuhkan dari luar hanya PostgreSQL engine dan SeaweedFS — dua-duanya
# dijangkau lewat alamat di .env, dan boleh milik stack mana pun.
#
#     cp .env.server.example .env        # lalu isi
#     docker compose -f docker-compose.server.yml --env-file .env up -d --build
#
# Server yang belum punya PostgreSQL + SeaweedFS: `docker-compose.infra.yml` di
# folder ini (lihat DEPLOY.md).
#
# lib/, components/, konverter/, dan infra/skema/ di-mount dari folder ini —
# `git pull` lalu restart container yang bersangkutan, tanpa build ulang. Image
# service juga membawa salinannya, jadi mount itu bukan syarat untuk jalan.

# DSN ditulis SEKALI lalu dipakai dua service. Kalau ditulis dua kali, cepat
# atau lambat yang satu diubah dan yang lain tertinggal — skema masuk ke satu
# basis data, service membaca yang lain.
x-pg-dsn: &pg_dsn "host=${PG_HOST:?isi di .env} port=${PG_PORT:-5430} dbname=${PG_DB:-synchrono} user=${PG_USER:-root} password=${PG_PASSWORD:?isi di .env}"

services:
  # ── Migrasi + seeder, sekali jalan lalu berhenti ────────────────────────
  #
  # migrate.py mengubah BENTUK basis data (tiap migrasi dicatat di
  # `schema_migrations`, tidak pernah dua kali); seed.py mengisi DATA awal dengan
  # ON CONFLICT DO NOTHING, jadi ambang yang disetel operator tidak pernah
  # ditimpa. Service menunggunya selesai dengan sukses.
  skema-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: synchrono-service:2.0.0
    container_name: synchrono-skema-service
    environment:
      PG_DSN: *pg_dsn
      SKEMA_PERCOBAAN: "${SKEMA_PERCOBAAN:-12}"
    networks: [luar]
    volumes:
      - ./infra/skema:/skema:ro
    command:
      - sh
      - -c
      - |
        cd /skema
        for i in $$(seq 1 "$${SKEMA_PERCOBAAN:-12}"); do
          if python migrate.py && python seed.py; then
            echo "[skema] migrasi & seeding selesai."
            exit 0
          fi
          echo "[skema] PostgreSQL belum siap / gagal — percobaan $$i, ulang 5 detik lagi"
          sleep 5
        done
        echo "[skema] GAGAL setelah $${SKEMA_PERCOBAAN:-12} percobaan. Periksa PG_HOST/PG_PORT/PG_PASSWORD di .env."
        exit 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  synchrono-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: synchrono-service:2.0.0
    container_name: synchrono-service
    ports:
      # 7860 = menggantikan Langflow: alamat yang disetel di portal tidak perlu
      # diubah. 8000 kalau berdampingan dengan Langflow yang masih jalan.
      - "${SERVICE_PORT:-8000}:8000"
    environment:
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      ACCESS_LOG: "${ACCESS_LOG:-0}"

      # ── Autentikasi, kontrak Langflow ────────────────────────────────────
      SERVICE_SUPERUSER: "${SERVICE_SUPERUSER:-admin}"
      # Kosong = login dimatikan; hanya kunci statis/terdaftar yang berlaku.
      SERVICE_SUPERUSER_PASSWORD: "${SERVICE_SUPERUSER_PASSWORD:-}"
      # Kunci sk-... yang dipakai portal — portal pindah tanpa mengubah setelannya.
      SERVICE_API_KEY: "${SERVICE_API_KEY:-}"
      # Penanda tangan token login. Kosong = acak tiap restart (cukup login ulang).
      SERVICE_SECRET_KEY: "${SERVICE_SECRET_KEY:-}"

      # ── Penyimpanan ─────────────────────────────────────────────────────
      PG_DSN: *pg_dsn
      S3_ENDPOINT: "${S3_ENDPOINT:?isi di .env}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"

      WILAYAH_PARQUET: "s3://syncrono-master/wilayah/master_wilayah_nik.parquet"
      WILAYAH_S3_ENDPOINT: ""
      WILAYAH_S3_KEY: ""
      WILAYAH_S3_SECRET: ""
      WILAYAH_KECAMATAN_TEGAS: "${WILAYAH_KECAMATAN_TEGAS:-0}"

      # ── Matching & reasoning ────────────────────────────────────────────
      PORTAL_PG_DSN: "${PORTAL_PG_DSN:-}"
      MATCHING_MAX_CONCURRENT: "${MATCHING_MAX_CONCURRENT:-1}"
      REASONING_AI_BASE_URL: "${REASONING_AI_BASE_URL:-}"
      REASONING_AI_MODEL: "${REASONING_AI_MODEL:-gemma3:12b}"
      REASONING_AI_API_KEY: "${REASONING_AI_API_KEY:-}"
      REASONING_AI_ALLOW_EXTERNAL: "${REASONING_AI_ALLOW_EXTERNAL:-0}"
      REASONING_AI_MAX_PATTERNS_PER_JOB: "${REASONING_AI_MAX_PATTERNS_PER_JOB:-25}"
      REASONING_AI_BUDGET_SECONDS: "${REASONING_AI_BUDGET_SECONDS:-90}"

      # ── DuckDB ──────────────────────────────────────────────────────────
      DUCKDB_MEMORY_LIMIT: "${DUCKDB_MEMORY_LIMIT:-3GB}"
      DUCKDB_TEMP_DIR: "${DUCKDB_TEMP_DIR:-/tmp/duckdb_spill}"
      DUCKDB_MODE: "${DUCKDB_MODE:-kolam}"
      DUCKDB_POOL_SIZE: "${DUCKDB_POOL_SIZE:-8}"
      DUCKDB_POOL_TIMEOUT: "${DUCKDB_POOL_TIMEOUT:-30}"
      DUCKDB_POOL_MAX_UMUR: "${DUCKDB_POOL_MAX_UMUR:-1800}"

      # ── Grading & normalisasi ───────────────────────────────────────────
      GRADING_MAX_CONCURRENT: "${GRADING_MAX_CONCURRENT:-2}"
      GRADING_STALE_MINUTES: "15"
      GRADING_CALLBACK_RETRIES: "3"
      GRADING_CALLBACK_TIMEOUT: "20"
      NORMALISASI_AI: "${NORMALISASI_AI:-nama_saja}"
      NORMALISASI_AI_MODEL: "${NORMALISASI_AI_MODEL:-gemma4:31b}"
      NORMALISASI_AI_BASE_URL: "${NORMALISASI_AI_BASE_URL:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-ollama}"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./components:/components:ro
    depends_on:
      skema-service:
        condition: service_completed_successfully
      s3-relay:
        condition: service_started
      konverter:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # luar: PostgreSQL & SeaweedFS backend.  dalam: konverter jalur B.
    networks: [luar, dalam]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Penerus S3 untuk konverter ──────────────────────────────────────────
  #
  # Konverter tinggal di jaringan `dalam` yang TIDAK punya rute ke mana pun —
  # berkas tidak tepercaya yang dipulihkannya tidak bisa mengirim apa pun keluar.
  # Penerus ini satu-satunya jembatan: berkaki di kedua jaringan, meneruskan
  # SATU port TCP ke SATU alamat. TCP mentah, bukan HTTP — tanda tangan SigV4
  # dihitung atas header Host, dan proxy HTTP yang menulis ulangnya membatalkan
  # tanda tangan itu.
  s3-relay:
    image: alpine/socat:latest
    container_name: synchrono-s3-relay
    command: >
      TCP-LISTEN:8333,fork,reuseaddr
      TCP:${S3_RELAY_TARGET:?isi di .env - biasanya sama dengan S3_ENDPOINT}
    networks: [dalam, luar]
    restart: unless-stopped

  # ── Konverter jalur B (.sql / .mdf / .dmp) ──────────────────────────────
  #
  # PostgreSQL selalu naik; yang lain di balik profil karena memegang memori
  # sepanjang hidup, dipakai atau tidak:
  #     docker compose -f docker-compose.server.yml --env-file .env \
  #       --profile mysql up -d --build konverter-mysql      (atau mssql / oracle)
  # Hanya di jaringan `dalam`, tanpa `ports:` — port yang dipublikasikan Docker
  # melewati ufw, dan layanan ini memulihkan berkas tidak tepercaya.
  konverter:
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter
    container_name: synchrono-konverter
    environment:
      # Superuser hanya untuk CREATE/DROP DATABASE. Dumpnya dipulihkan sebagai
      # peran `pemulih` yang BUKAN superuser — lihat konverter/_pulih.py.
      POSTGRES_PASSWORD: "${KONV_PG_PASSWORD:-konversi_lokal}"
      POSTGRES_DB: postgres
      KONV_PG_HOST: 127.0.0.1
      KONV_PG_PORT: "5432"
      KONV_PORT: "8390"
      KONV_MAX_CONCURRENT: "${KONV_MAX_CONCURRENT:-1}"
      KONV_BATAS_DETIK: "${KONV_BATAS_DETIK:-1800}"
      KONV_BATAS_MB: "${KONV_BATAS_MB:-4096}"
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"
    volumes:
      # lib/ dipakai `_umum.py`: pengenal kolom yang sama dengan grading.
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-pg18:/var/lib/postgresql
    networks: [dalam]
    restart: unless-stopped

  konverter-mssql:
    profiles: [mssql]
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter-mssql
    container_name: synchrono-konverter-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${KONV_MSSQL_PASSWORD:-Konversi_Lokal_12345!}"
      KONV_MESIN: sqlserver
      KONV_PORT: "8391"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_MB: "${KONV_BATAS_MB:-4096}"
      KONV_DUCKDB_HOME: /var/opt/mssql
      KONV_KERJA_UNDUH: /var/opt/mssql/data/unduh
      KONV_MSSQL_KERJA: /var/opt/mssql/data/uji
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-mssql-data:/var/opt/mssql/data
    networks: [dalam]
    restart: unless-stopped

  konverter-oracle:
    profiles: [oracle]
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter-oracle
    container_name: synchrono-konverter-oracle
    environment:
      ORACLE_PASSWORD: "${KONV_ORACLE_PASSWORD:-Konversi_Lokal_12345}"
      KONV_MESIN: oracle
      KONV_PORT: "8392"
      KONV_MAX_CONCURRENT: "1"
      KONV_BATAS_MB: "${KONV_BATAS_MB:-4096}"
      KONV_ORA_DSN: "localhost:1521/FREEPDB1"
      KONV_ORA_KERJA: /opt/oracle/dmp
      KONV_ORA_DIRNAME: KONVERSI_DIR
      KONV_KERJA_UNDUH: /opt/oracle/dmp/unduh
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-oracle-data:/opt/oracle/oradata
    networks: [dalam]
    restart: unless-stopped

  konverter-mysql:
    profiles: [mysql]
    build:
      context: .
      dockerfile: infra/Dockerfile.konverter-mysql
    container_name: synchrono-konverter-mysql
    environment:
      MARIADB_ROOT_PASSWORD: "${KONV_MYSQL_PASSWORD:-Konversi_Lokal_12345}"
      KONV_MESIN: mysql
      KONV_PORT: "8393"
      KONV_MAX_CONCURRENT: "${KONV_MAX_CONCURRENT:-1}"
      KONV_BATAS_DETIK: "${KONV_BATAS_DETIK:-1800}"
      KONV_BATAS_MB: "${KONV_BATAS_MB:-4096}"
      LIB_SYNCHRONO: /synchrono/lib
      S3_ENDPOINT: "s3-relay:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-ADMIN}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-Password1234}"
      S3_USE_SSL: "false"
    volumes:
      - ./lib:/synchrono/lib:ro
      - ./konverter:/konverter:ro
      - konverter-mysql-data:/var/lib/mysql
    networks: [dalam]
    restart: unless-stopped

networks:
  # `luar` — bridge biasa: bisa menjangkau host, untuk PostgreSQL & SeaweedFS.
  luar:
    driver: bridge
  # `dalam` — TANPA rute ke mana pun. Konverter, penerus S3, dan service saja.
  dalam:
    internal: true

volumes:
  konverter-pg18:
  konverter-mssql-data:
  konverter-oracle-data:
  konverter-mysql-data:
